# ---
# tags: cyb, sync, config
# crystal-type: source
# crystal-domain: cyb
# ---
[workspace]

[package]
name = "cyber-sync"
version = "0.1.0"
edition = "2024"
description = "Local device data availability — erasure-coded virtual filesystem"

[[bin]]
name = "cyber-sync"
path = "src/bin/main.rs"

[dependencies]
nebu = { path = "../../nebu/rs" }
cyber-hemera = { path = "../../hemera/rs" }
iroh = { path = "../../radio/iroh", features = ["address-lookup-mdns"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
rand = "0.9"
clap = { version = "4", features = ["derive"] }
tracing-subscriber = "0.3"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[patch.crates-io]
cyber-hemera = { path = "../../hemera/rs" }
iroh-quinn = { git = "https://github.com/n0-computer/quinn", rev = "ebbd7654658415a3c5e627f0c0113e6abc2ac020" }
iroh-quinn-proto = { git = "https://github.com/n0-computer/quinn", rev = "ebbd7654658415a3c5e627f0c0113e6abc2ac020" }
iroh-quinn-udp = { git = "https://github.com/n0-computer/quinn", rev = "ebbd7654658415a3c5e627f0c0113e6abc2ac020" }
