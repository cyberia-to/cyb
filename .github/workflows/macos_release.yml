name: macOS Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release'
        type: boolean
        default: false
  push:
    branches:
      - feat/tauri-mining
    tags:
      - 'v*'

env:
  DENO_VERSION: v2.x
  NODE_VERSION: '22'
  KUBO_VERSION: v0.34.1

jobs:
  macos-release:
    runs-on: macos-14  # Apple Silicon (M1)
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Toolchain ───────────────────────────────────────────────
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            cyb-boot -> target

      # ── Apple Code Signing ──────────────────────────────────────
      - name: Import Apple certificates
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import Developer ID Application certificate
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/app-cert.p12
          security import $RUNNER_TEMP/app-cert.p12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          rm -f $RUNNER_TEMP/app-cert.p12

          # Import Developer ID Installer certificate (for .pkg signing)
          echo "$APPLE_INSTALLER_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/pkg-cert.p12
          security import $RUNNER_TEMP/pkg-cert.p12 \
            -P "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          rm -f $RUNNER_TEMP/pkg-cert.p12

          # Make keychain available for codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Auto-detect signing identities from imported certs
          APP_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep 'Developer ID Application' | head -1 | sed 's/.*"\(.*\)"/\1/')
          PKG_IDENTITY=$(security find-identity -v -p basic "$KEYCHAIN_PATH" \
            | grep 'Developer ID Installer' | head -1 | sed 's/.*"\(.*\)"/\1/')

          # Fall back to secrets if auto-detection fails
          APP_IDENTITY="${APP_IDENTITY:-${{ secrets.APPLE_SIGNING_IDENTITY }}}"
          PKG_IDENTITY="${PKG_IDENTITY:-${{ secrets.PKG_SIGNING_IDENTITY }}}"

          echo "APPLE_SIGNING_IDENTITY=$APP_IDENTITY" >> $GITHUB_ENV
          echo "PKG_SIGNING_IDENTITY=$PKG_IDENTITY" >> $GITHUB_ENV
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

          echo "App signing identity: $APP_IDENTITY"
          echo "Pkg signing identity: $PKG_IDENTITY"

      - name: Setup Apple API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          mkdir -p $RUNNER_TEMP/private_keys
          echo "$APPLE_API_KEY_BASE64" | base64 --decode \
            > $RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY}.p8

          echo "APPLE_API_KEY=$APPLE_API_KEY" >> $GITHUB_ENV
          echo "APPLE_API_ISSUER=${{ secrets.APPLE_API_ISSUER }}" >> $GITHUB_ENV
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY}.p8" >> $GITHUB_ENV

      # ── Dependencies ────────────────────────────────────────────
      - name: Install JS dependencies
        run: deno install

      - name: Download Kubo sidecar
        run: |
          TAURI_TARGET_TRIPLE=aarch64-apple-darwin \
            src-tauri/scripts/download-kubo.sh ${{ env.KUBO_VERSION }}

      # ── Build ───────────────────────────────────────────────────
      - name: Build web frontend
        run: deno task build-tauri
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Build Tauri app (sign + notarize)
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          RUSTFLAGS: '-C target-cpu=apple-m1'
        run: |
          npx @tauri-apps/cli build \
            --target aarch64-apple-darwin \
            --config '{"build":{"beforeBuildCommand":""},"bundle":{"macOS":{"signingIdentity":"'"$APPLE_SIGNING_IDENTITY"'"}}}' \
            -- --features gpu-metal

      - name: Build .pkg (sign + notarize)
        run: |
          src-tauri/scripts/macos-pkg.sh \
            --app-path src-tauri/target/aarch64-apple-darwin/release/bundle/macos/cyb.app \
            --output-dir src-tauri/target/aarch64-apple-darwin/release/bundle/pkg

      - name: Build cyb-boot .app bundle (sign + notarize)
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          RUSTFLAGS: '-C target-cpu=apple-m1'
        run: |
          cd cyb-boot && cargo build --release --target aarch64-apple-darwin && cd ..
          BOOT_BIN=cyb-boot/target/aarch64-apple-darwin/release/cyb-boot

          # Sign binary with hardened runtime
          codesign --force --options runtime --sign "$APPLE_SIGNING_IDENTITY" "$BOOT_BIN"

          # Create .app bundle (no boot.dat — server appends it per-user)
          APP="$RUNNER_TEMP/boot cyb.app"
          mkdir -p "$APP/Contents/MacOS"
          cp "$BOOT_BIN" "$APP/Contents/MacOS/cyb-boot"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '<key>CFBundleExecutable</key><string>cyb-boot</string>' \
            '<key>CFBundleName</key><string>boot cyb</string>' \
            '<key>CFBundleDisplayName</key><string>boot cyb</string>' \
            '<key>CFBundleIdentifier</key><string>ai.cyb.boot</string>' \
            '<key>CFBundleVersion</key><string>1.0</string>' \
            '<key>CFBundleShortVersionString</key><string>1.0</string>' \
            '<key>CFBundlePackageType</key><string>APPL</string>' \
            '<key>LSMinimumSystemVersion</key><string>11.0</string>' \
            '<key>NSHighResolutionCapable</key><true/>' \
            '</dict></plist>' > "$APP/Contents/Info.plist"

          # Sign the .app bundle
          codesign --force --options runtime --sign "$APPLE_SIGNING_IDENTITY" "$APP"

          # Notarize
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/boot-cyb-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/boot-cyb-notarize.zip" \
            --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" --wait
          rm -f "$RUNNER_TEMP/boot-cyb-notarize.zip"

          # Staple notarization ticket into the .app
          xcrun stapler staple "$APP"

          # Final zip (with stapled ticket) — internal artifact for boot server
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/boot-cyb.zip"

      # ── Artifacts ───────────────────────────────────────────────
      - name: Collect release artifacts
        run: |
          mkdir -p release-artifacts

          # .dmg (GitHub Releases — direct download for users)
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg \
            release-artifacts/

          # .pkg (GitHub Releases — cyb-boot downloads this to install cyb)
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/pkg/*.pkg \
            release-artifacts/cyb.pkg

          echo "=== Release artifacts ==="
          ls -lh release-artifacts/

      - name: Collect boot server artifacts
        run: |
          mkdir -p boot-artifacts

          # Notarized .app bundle template (upload to Cyberproxy artifacts/)
          cp "$RUNNER_TEMP/boot-cyb.zip" boot-artifacts/

          # Bare cyb-boot binary (upload to Cyberproxy artifacts/)
          cp cyb-boot/target/aarch64-apple-darwin/release/cyb-boot \
            boot-artifacts/cyb-boot-aarch64-apple-darwin

          echo "=== Boot server artifacts ==="
          ls -lh boot-artifacts/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('v{0}', github.sha) }}
          files: release-artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.create_release }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-aarch64
          path: release-artifacts/

      - name: Upload boot server artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boot-server-artifacts
          path: boot-artifacts/

      # ── Deploy boot artifacts via webhook ────────────────────────
      - name: Trigger boot artifact deployment
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feat/tauri-mining' || startsWith(github.ref, 'refs/tags/')
        env:
          WEBHOOK_SECRET: ${{ secrets.BOOT_DEPLOY_WEBHOOK_SECRET }}
        run: |
          PAYLOAD="{\"run_id\": ${{ github.run_id }}}"
          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha1 -hmac "$WEBHOOK_SECRET" | sed 's/.*= //')
          curl -f -X POST "https://cyb.ai/hooks/boot-deploy" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature: sha1=$SIGNATURE" \
            -d "$PAYLOAD"

      # ── Cleanup ─────────────────────────────────────────────────
      - name: Cleanup keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
