# The cyber toolset — the single source of truth.
#
# `cy tools`         lists these with status (● installed · ⚠ stale · ○ missing)
# `cy install [name…|--all]`  builds each and links it onto $PATH
# `cy <name> …`      dispatches to a tool (only names listed here run)
#
# Fields per tool:
#   name  the command
#   dir   build directory under $CYBER_ROOT (default ~/cyber)
#   pkg   cargo package(s) for `-p` (space-separated; omit for a single crate)
#   bin   built binary name (default: name) — set when they differ
#   desc  one-line description (keep it short — one role each)

tool = [
  { name = "hemera",     dir = "hemera",        pkg = "hemera-cli",  desc = "the hash" },
  { name = "mudra",      dir = "mudra",                              desc = "the seal — keys & claims" },
  { name = "nox",        dir = "nox",           pkg = "nox-cli",     desc = "the VM" },
  { name = "rune",       dir = "rune",          pkg = "rune-cli",    desc = "the language → nox" },
  { name = "trident",    dir = "trident",                            desc = "the provable language" },
  { name = "strata",     dir = "strata",        pkg = "strata-cli nebu-cli jali-cli kuro-cli trop-cli genies-cli", bin = "strata", desc = "the field algebras" },
  { name = "glia",       dir = "glia",          pkg = "glia-cli import run", bin = "glia", desc = "the model layer" },
  { name = "radio",      dir = "radio",         pkg = "radio-cli",   desc = "the transport" },
  { name = "cybergraph", dir = "cybergraph/cli",                     desc = "the cyberlink processor" },
  { name = "bbg",        dir = "bbg/cli",                            desc = "the authenticated state" },
  { name = "inf",        dir = "inf/rs",        pkg = "inf-cli",     desc = "the query engine" },
  { name = "zheng",      dir = "zheng",         pkg = "zheng-cli",   desc = "the proof system" },
  { name = "eidos",      dir = "eidos",         pkg = "eidos",       desc = "the proof kernel" },
  { name = "tru",        dir = "tru",           pkg = "tru-cli",     desc = "the truth layer" },
  { name = "cyb",        dir = "cyb",           pkg = "cyb-shell",   desc = "the node (GUI)" },
  { name = "cy",         dir = "cyb",           pkg = "cy",          desc = "the terminal face" },
]
