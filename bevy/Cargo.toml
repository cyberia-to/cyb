[package]
name = "cyb-shell"
version = "0.1.0"
edition = "2024"

[features]
default = ["desktop"]
desktop = [
    "dep:bevy",
    "dep:global-hotkey",
    "dep:alacritty_terminal",
    "dep:sugarloaf",
    "dep:tray-icon",
    "dep:nu-protocol",
    "dep:nu-engine",
    "dep:nu-parser",
    "dep:nu-command",
    "dep:nu-cmd-lang",
    "dep:nu-cmd-extra",
    "dep:nu-cli",
    "dep:nu-std",
    "dep:nu-utils",
]
android = ["dep:tao", "dep:android_logger"]

[lib]
name = "cyb_shell"
crate-type = ["cdylib", "lib"]
path = "src/lib.rs"

[[bin]]
name = "cyb-shell"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
# Core (all platforms)
wry = { version = "0.53", features = ["transparent"] }
futures = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
log = "0.4"

# Desktop (behind "desktop" feature)
bevy = { workspace = true, optional = true }
global-hotkey = { version = "0.7.0", optional = true }
alacritty_terminal = { version = "0.25.1", optional = true }
sugarloaf = { path = "../vendor/sugarloaf", optional = true }
tray-icon = { version = "0.21", optional = true }
nu-protocol = { path = "../vendor/nushell/crates/nu-protocol", optional = true }
nu-engine = { path = "../vendor/nushell/crates/nu-engine", optional = true }
nu-parser = { path = "../vendor/nushell/crates/nu-parser", optional = true }
nu-command = { path = "../vendor/nushell/crates/nu-command", default-features = false, features = ["os"], optional = true }
nu-cmd-lang = { path = "../vendor/nushell/crates/nu-cmd-lang", optional = true }
nu-cmd-extra = { path = "../vendor/nushell/crates/nu-cmd-extra", optional = true }
nu-cli = { path = "../vendor/nushell/crates/nu-cli", optional = true }
nu-std = { path = "../vendor/nushell/crates/nu-std", optional = true }
nu-utils = { path = "../vendor/nushell/crates/nu-utils", optional = true }

# Android (behind "android" feature)
tao = { version = "0.34", optional = true }
android_logger = { version = "0.14", optional = true }
