[package]
name = "cyb-llm"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cyb-llm"
path = "src/main.rs"

[[bin]]
name = "bench-metal"
path = "bench/metal.rs"

[[bin]]
name = "bench-ane"
path = "bench/ane.rs"

[[bin]]
name = "bench-e2e"
path = "bench/e2e.rs"

[[bin]]
name = "bench-ane-compile"
path = "bench/ane_compile.rs"

[[bin]]
name = "bench-ane-infer"
path = "bench/ane_infer.rs"

[[bin]]
name = "bench-ane-train"
path = "bench/ane_train.rs"

[[bin]]
name = "bench-speculative"
path = "bench/speculative.rs"

[dependencies]
# GPU compute
wgpu = { version = "24", features = ["wgsl"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }

# Model loading
prost = "0.13"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Tokenization + HF
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
hf-hub = { version = "0.5", features = ["default-tls"] }

# HTTP serve (OpenAI-compatible API)
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Utils
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
half = { version = "2", features = ["num-traits"] }

# Apple Silicon drivers (macOS only)
[target.'cfg(target_os = "macos")'.dependencies]
rane = { path = "../../rane" }
aruminium = { path = "../../aruminium" }

[build-dependencies]
prost-build = "0.13"
