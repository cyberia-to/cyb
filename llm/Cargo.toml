[package]
name = "cyb-llm"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cyb-llm"
path = "src/main.rs"

# bench-* binaries removed — they exercised the retired wgpu/metal/ANE
# runtime paths. Benchmarking the live runtime happens through `mr bench`.

[dependencies]
# GPU compute
wgpu = { version = "24", features = ["wgsl"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }

# Model loading
prost = "0.13"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Tokenization + HF
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
hf-hub = { version = "0.5", features = ["default-tls"] }

# HTTP serve (OpenAI-compatible API)
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Utils
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
half = { version = "2", features = ["num-traits"] }

# Apple Silicon drivers (macOS only)
[target.'cfg(target_os = "macos")'.dependencies]
rane = { path = "../../honeycrisp/rane" }
aruminium = { path = "../../honeycrisp/aruminium" }

[build-dependencies]
prost-build = "0.13"
