[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
default-run = "app"
edition = "2021"
rust-version = "1.60"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
serde_json = "1.0.128"
serde = { version = "1.0.210", features = ["derive"] }
tauri = { version = "2.10", features = ["devtools"] }
tauri-plugin-shell = "2"
tokio = { version = "1.40.0", features = ["full"] }
uhash-core = { git = "https://github.com/cyberia-to/universal-hash", rev = "2fc7b15" }
hex = "0.4"

# Desktop-only dependencies (IPFS, CozoDB, warp server, reqwest)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
reqwest = { version = "0.12.7", features = ["blocking", "json"] }
futures = "0.3"
ipfs-api = "0.17.0"
ipfs-api-backend-hyper = "0.6"
dirs = "5.0.1"
cozo = { version = "0.7.6", features = ["storage-rocksdb"] }
warp = "0.3.7"

[features]
custom-protocol = ["tauri/custom-protocol"]
