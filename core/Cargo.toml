[package]
name = "cyb-core"
version = "0.1.0"
edition = "2024"
description = "Minimal cyb runtime core — chroma graph, signal bus, well-known particles"
license = "Cyber"

[features]
# verified-streaming decode via the radio family's BAO crate — synchronous,
# no networking (not the iroh/radio transport, see the `foculus` note below)
blobs = ["dep:cyber-bao"]

[dependencies]
cybergraph = { path = "../../cybergraph" }
bbg = { path = "../../bbg/rs" }
cyber-hemera = { path = "../../hemera/rs" }
# codec only (chain, frames, tape) — not the iroh/radio transport (`net`)
foculus = { path = "../../foculus", default-features = false }
# rewards path: Link / Context for settle_epoch from wallet helpers
tru = { package = "cyber-tru", path = "../../tru/rs" }
# PLUMB conservation mint ledger
tok = { package = "cyber-tok", path = "../../tok/rs" }
# optional: BAO verified-streaming decode, no transport
cyber-bao = { path = "../../radio/cyber-bao", optional = true }
