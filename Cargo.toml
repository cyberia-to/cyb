[workspace]
resolver = "2"
members = ["core", "shell", "cli"]
# `cargo run` / `cargo build` at the root default to the GUI (shell → binary `cyb`).
# The CLI is built/run explicitly: `cargo run -p cy` (binary `cy`).
default-members = ["core", "shell"]
exclude = ["apps"]

[workspace.dependencies]
bevy = "0.18.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
bip39 = { version = "2", features = ["rand"] }
ureq = { version = "3", features = ["json"] }

[profile.dev]
split-debuginfo = "unpacked"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

[profile.release-dev]
inherits = "release"
lto = "thin"
codegen-units = 8
debug = false

[patch.crates-io]
naga = { path = "../evy/forks/naga" }
aruminium = { path = "../honeycrisp/aruminium" }
acpu      = { path = "../honeycrisp/acpu" }
unimem    = { path = "../honeycrisp/unimem" }
