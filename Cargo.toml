[workspace]
resolver = "2"
members = ["core", "shell", "cli"]
# GUI package+binary: `cyb` (shell/). CLI: `cargo run -p cy` (binary `cy`).
default-members = ["core", "shell"]
exclude = ["apps", "crates/cyb-reserve", "crates/cyb"]

[workspace.dependencies]
bevy = "0.18.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
bip39 = { version = "2", features = ["rand"] }
ureq = { version = "3", features = ["json"] }

[profile.dev]
split-debuginfo = "unpacked"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

[profile.release-dev]
inherits = "release"
lto = "thin"
codegen-units = 8
debug = false

[patch.crates-io]
naga = { path = "../evy/forks/naga" }
aruminium = { path = "../honeycrisp/aruminium" }
acpu      = { path = "../honeycrisp/acpu" }
unimem    = { path = "../honeycrisp/unimem" }
# one hemera in the graph: a neuron id is hemera(pubkey), so the hash that
# decides who this body is may have exactly one implementation linked in.
# soft3 asks for it from crates.io; the workspace builds it from the sibling
# checkout — without this patch both resolve and the identity can split.
cyber-hemera = { path = "../hemera/rs" }
